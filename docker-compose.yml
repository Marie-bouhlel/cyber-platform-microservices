version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  ms1-collecte:
    build: ./ms1-collecte
    ports:
      - "50051:50051"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    environment:
      KAFKA_BROKER: kafka:9092

  ms2-analyse:
    build: ./ms2-analyse
    ports:
      - "50052:50052"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    environment:
      KAFKA_BROKER: kafka:9092

  ms3-notification:
    build: ./ms3-notification
    ports:
      - "50053:50053"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    environment:
      KAFKA_BROKER: kafka:9092

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
      - "4000:4000"
    depends_on:
      - ms1-collecte
      - ms2-analyse
      - ms3-notification
    environment:
      MS1_HOST: ms1-collecte:50051
      MS2_HOST: ms2-analyse:50052
      MS3_HOST: ms3-notification:50053